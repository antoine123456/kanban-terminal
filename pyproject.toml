[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanban-terminal"
version = "0.1.0"
description = "Un fichier Markdown d'idées en Kanban interactif dans le terminal (VS Code compris)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]

[project.scripts]
kanban = "kanban_terminal.app:main"
gantt = "kanban_terminal.gantt:main"
tests = "kanban_terminal.junit:main"

[tool.setuptools]
packages = ["kanban_terminal"]
